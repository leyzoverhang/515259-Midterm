basePath: /api/v1
definitions:
  internal_user.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  internal_user.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  wongnok_internal_httputil.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API สำหรับจัดการกับระบบสูตรอาหาร
  title: Wongnok API
  version: "1.0"
paths:
  /users:
    post:
      description: สร้าง user โดยรับข้อมูลมาจาก Client และ generate uuid ให้ พร้อมส่งรายละเอียดของ
        user ที่ถูกสร้างกลับไป
      parameters:
      - description: รายละเอียดสำหรับสร้าง User
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      summary: สร้าง user
      tags:
      - users
  /users/{id}:
    get:
      description: ค้นหาข้อมูล User จาก UUID แล้วคืนข้อมูล User ที่เจอกลับมา
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      summary: ดีงข้อมูลจาก user แบบรายคน
      tags:
      - users
swagger: "2.0"
