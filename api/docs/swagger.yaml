basePath: /api/v1
definitions:
  auth.Credential:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  auth.ExchangeRequest:
    properties:
      ticket:
        example: pQx7...base64url...
        type: string
    required:
    - ticket
    type: object
  auth.LogoutRequest:
    properties:
      refreshToken:
        example: eyJhbGci...
        type: string
    required:
    - refreshToken
    type: object
  httputil.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  recipe.CreateRecipeRequest:
    properties:
      description:
        type: string
      difficultyId:
        type: string
      durationId:
        type: string
      imageUrl:
        type: string
      ingredients:
        items:
          $ref: '#/definitions/recipe.RecipeIngredientRequest'
        type: array
      instructions:
        items:
          $ref: '#/definitions/recipe.RecipeInstructionRequest'
        type: array
      name:
        type: string
    required:
    - description
    - difficultyId
    - durationId
    - ingredients
    - instructions
    - name
    type: object
  recipe.CreateRecipeResponse:
    properties:
      id:
        type: integer
    type: object
  recipe.CreatorResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  recipe.DifficultyResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  recipe.DurationResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  recipe.IngredientResponse:
    properties:
      description:
        type: string
      id:
        type: integer
    type: object
  recipe.InstructionResponse:
    properties:
      description:
        type: string
      id:
        type: integer
    type: object
  recipe.ListRecipesResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/recipe.RecipeResponse'
        type: array
      total:
        type: integer
    type: object
  recipe.RecipeIngredientRequest:
    properties:
      description:
        type: string
    required:
    - description
    type: object
  recipe.RecipeInstructionRequest:
    properties:
      description:
        type: string
    required:
    - description
    type: object
  recipe.RecipeResponse:
    properties:
      createdAt:
        type: string
      creator:
        $ref: '#/definitions/recipe.CreatorResponse'
      description:
        type: string
      difficulty:
        $ref: '#/definitions/recipe.DifficultyResponse'
      duration:
        $ref: '#/definitions/recipe.DurationResponse'
      id:
        type: integer
      imageUrl:
        type: string
      ingredients:
        items:
          $ref: '#/definitions/recipe.IngredientResponse'
        type: array
      instructions:
        items:
          $ref: '#/definitions/recipe.InstructionResponse'
        type: array
      name:
        type: string
      updatedAt:
        type: string
    type: object
  user.UserResponse:
    properties:
      email:
        example: somchai@pea.co.th
        type: string
      id:
        example: eb238dfe-9d49-4345-9cc9-350c50b429e6
        type: string
      name:
        example: สมชาย ใจดี
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API สำหรับจัดการกับระบบสูตรอาหาร
  title: Wongnok API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Keycloak redirect มาที่นี่เองอัตโนมัติ ไม่ใช่สิ่งที่ frontend เรียกตรงๆ
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State ที่ตรงกับตอน /auth/login
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect กลับ frontend พร้อม ticket
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: รับ callback จาก Keycloak
      tags:
      - auth
  /auth/exchange:
    post:
      consumes:
      - application/json
      description: Frontend เรียกผ่าน axios หลังถูก redirect กลับมาพร้อม ticket
      parameters:
      - description: ticket
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Credential'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: แลก ticket เป็น credential จริง
      tags:
      - auth
  /auth/login:
    get:
      description: Redirect ไปหน้า login ของ Keycloak
      responses:
        "302":
          description: Redirect ไป Keycloak
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: เริ่ม login ผ่าน Keycloak
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token ที่ Keycloak จริง
      parameters:
      - description: refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      responses:
        "204":
          description: Logout สำเร็จ
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ออกจากระบบ
      tags:
      - auth
  /recipes:
    get:
      description: ค้นหาสูตรอาหารทั้งหมด และสามารถกรองด้วย ชื่อ, ความยาก และเรียงตามเวลาที่สร้างได้
      parameters:
      - description: ชื่อของสูตรอาหาร
        in: query
        name: name
        type: string
      - description: Id ของความยากในการทำ
        in: query
        name: difficulty
        type: string
      - default: DESC
        description: เรียงลำดับตามเวลาที่สร้าง
        enum:
        - ASC
        - DESC
        in: query
        name: sort
        type: string
      - default: 1
        description: หน้าที่ต้องการแสดง
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 12
        description: จำนวนรายการต่อหน้า
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/recipe.ListRecipesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: เรียกดูสูตรอาหารทั้งหมด
      tags:
      - recipes
    post:
      consumes:
      - application/json
      description: สร้างสูตรอาหารจากข้อมูลที่ระบุ โดยผู้ใช้ที่ยืนยันตัวตนแล้วจะเป็นผู้สร้างสูตร
      parameters:
      - description: Recipe data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/recipe.CreateRecipeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/recipe.CreateRecipeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: สร้างสูตรอาหาร
      tags:
      - recipes
  /recipes/{id}:
    get:
      description: ค้นหาสูตรอาหารจาก id แล้วคืนข้อมูลสูตรอาหารที่เจอกลับมา
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/recipe.RecipeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: เรียกดูสูตรอาหารแบบรายรายการ
      tags:
      - recipes
  /users/{id}:
    get:
      description: ค้นหาข้อมูล User จาก UUID แล้วคืนข้อมูล User ที่เจอกลับมา
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ดึงข้อมูลจาก user แบบรายคน
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: พิมพ์ "Bearer" ตามด้วย space แล้วตามด้วย JWT token เช่น "Bearer eyJhbGci..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
