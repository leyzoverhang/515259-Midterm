basePath: /api/v1
definitions:
  internal_auth.Credential:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  internal_auth.ExchangeRequest:
    properties:
      ticket:
        example: pQx7...base64url...
        type: string
    required:
    - ticket
    type: object
  internal_auth.LogoutRequest:
    properties:
      refreshToken:
        example: eyJhbGci...
        type: string
    required:
    - refreshToken
    type: object
  internal_recipe.CreateRecipeRequest:
    properties:
      description:
        type: string
      difficultyId:
        type: string
      durationId:
        type: string
      imageUrl:
        type: string
      ingredients:
        items:
          $ref: '#/definitions/internal_recipe.RecipeIngredientRequest'
        type: array
      instructions:
        items:
          $ref: '#/definitions/internal_recipe.RecipeInstructionRequest'
        type: array
      name:
        type: string
    required:
    - description
    - difficultyId
    - durationId
    - ingredients
    - instructions
    - name
    type: object
  internal_recipe.CreateRecipeResponse:
    properties:
      id:
        type: integer
    type: object
  internal_recipe.RecipeIngredientRequest:
    properties:
      description:
        type: string
    required:
    - description
    type: object
  internal_recipe.RecipeInstructionRequest:
    properties:
      description:
        type: string
    required:
    - description
    type: object
  internal_user.UserResponse:
    properties:
      email:
        example: somchai@pea.co.th
        type: string
      id:
        example: eb238dfe-9d49-4345-9cc9-350c50b429e6
        type: string
      name:
        example: สมชาย ใจดี
        type: string
    type: object
  wongnok_internal_httputil.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API สำหรับจัดการกับระบบสูตรอาหาร
  title: Wongnok API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Keycloak redirect มาที่นี่เองอัตโนมัติ ไม่ใช่สิ่งที่ frontend เรียกตรงๆ
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State ที่ตรงกับตอน /auth/login
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect กลับ frontend พร้อม ticket
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      summary: รับ callback จาก Keycloak
      tags:
      - auth
  /auth/exchange:
    post:
      consumes:
      - application/json
      description: Frontend เรียกผ่าน axios หลังถูก redirect กลับมาพร้อม ticket
      parameters:
      - description: ticket
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.Credential'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      summary: แลก ticket เป็น credential จริง
      tags:
      - auth
  /auth/login:
    get:
      description: Redirect ไปหน้า login ของ Keycloak
      responses:
        "302":
          description: Redirect ไป Keycloak
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      summary: เริ่ม login ผ่าน Keycloak
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token ที่ Keycloak จริง
      parameters:
      - description: refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LogoutRequest'
      responses:
        "204":
          description: Logout สำเร็จ
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ออกจากระบบ
      tags:
      - auth
  /recipes:
    post:
      consumes:
      - application/json
      description: สร้างสูตรอาหารจากข้อมูลที่ระบุ โดยผู้ใช้ที่ยืนยันตัวตนแล้วจะเป็นผู้สร้างสูตร
      parameters:
      - description: Recipe data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_recipe.CreateRecipeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_recipe.CreateRecipeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: สร้างสูตรอาหาร
      tags:
      - recipes
  /users/{id}:
    get:
      description: ค้นหาข้อมูล User จาก UUID แล้วคืนข้อมูล User ที่เจอกลับมา
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wongnok_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ดึงข้อมูลจาก user แบบรายคน
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: พิมพ์ "Bearer" ตามด้วย space แล้วตามด้วย JWT token เช่น "Bearer eyJhbGci..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
