services:
  postgres:
    image: postgres:17
    container_name: wongnok-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: Pe@devp00l
    ports:
      - "5432:5432"
    volumes:
      - wongnok-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.10-alpine
    container_name: wongnok-redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  wongnok-pgdata:
